name: testes
on:
  push:
  pull_request:
  schedule:
    - cron: "17 9 * * 1"  # toda segunda-feira
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          OFICINA_PROVEDOR: falso
